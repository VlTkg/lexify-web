<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexify — Экспресс-анализ договоров и Конструктор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #111827; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tg-card { background-color: #1f2937; border-color: #374151; word-break: break-word; overflow-wrap: break-word; }
        .identical-input-box { border: 1px solid #374151; background-color: #1f2937; border-radius: 0.75rem; padding: 0.65rem 0.875rem; font-size: 0.95rem; color: #ffffff; width: 100%; outline: none; }
        .identical-input-box:focus { border-color: #3b82f6; }
        .chip-btn {
            height: 34px; padding: 0 12px; border-radius: 0.75rem; font-size: 0.7rem; font-weight: 500;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; border: 1px solid #374151;
            white-space: nowrap;
        }
        .chip-btn.active { background-color: #3b82f6; color: #ffffff; border-color: #3b82f6; font-weight: 600; }
        .chip-btn:not(.active) { background-color: #1f2937; color: #9ca3af; }
        .chip-btn:not(.active):hover { background-color: #374151; color: #ffffff; }
        .btn-action {
            height: 40px; border-radius: 0.75rem; font-size: 0.8rem; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div class="max-w-2xl mx-auto p-3 space-y-4">
        <header class="text-center py-2 flex items-center justify-between">
            <button onclick="goHome()" id="home-btn" class="hidden text-gray-300 hover:text-white text-xs px-2.5 py-1.5 bg-gray-800 rounded-lg border border-gray-700">
                <i class="fa-solid fa-arrow-left mr-1"></i> На главную
            </button>
            <div class="mx-auto">
                <h1 class="text-xl font-bold tracking-tight text-white">Lexify</h1>
            </div>
            <div class="w-12"></div>
        </header>

        <!-- Конструктор полного договора -->
        <div id="form-container" class="tg-card rounded-2xl p-4 border shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-white">Конструктор полного договора</h2>
            
            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Тип документа</label>
                <div class="flex gap-2">
                    <button type="button" class="chip-btn active" onclick="setDocType('contract', this)">Договор услуг</button>
                    <button type="button" class="chip-btn" onclick="setDocType('offer', this)">Оферта</button>
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Юрисдикция</label>
                <div class="flex gap-2">
                    <button type="button" class="chip-btn active" onclick="setJurisdiction('Россия (РФ)', this)">Россия (РФ)</button>
                    <button type="button" class="chip-btn" onclick="setJurisdiction('Казахстан', this)">Казахстан</button>
                    <button type="button" class="chip-btn" onclick="setJurisdiction('Беларусь', this)">Беларусь</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-medium text-gray-300 block mb-1">Исполнитель</label>
                    <input type="text" id="executor-input" class="identical-input-box" value="Иванов И.И.">
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-300 block mb-1">Заказчик</label>
                    <input type="text" id="client-input" class="identical-input-box" value="ТОО «Альфа Технологии»">
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Суть услуг и предмет договора</label>
                <textarea id="desc-input" rows="2" class="identical-input-box">Разработка программного модуля автоматизации</textarea>
            </div>

            <!-- Блок кнопок управления рядом -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="generateDocument()" class="btn-action bg-blue-600 hover:bg-blue-500 text-white shadow-md">
                    <i class="fa-solid fa-file-contract mr-1.5"></i> Сгенерировать
                </button>
                <button onclick="resetForm()" class="btn-action bg-gray-700 hover:bg-gray-600 text-gray-200 border border-gray-600">
                    <i class="fa-solid fa-rotate-left mr-1.5"></i> Новый документ
                </button>
            </div>
        </div>

        <!-- Результат генерации -->
        <div id="result-wrapper" class="hidden tg-card rounded-2xl p-4 border shadow-lg space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-semibold text-gray-300">Готовый документ</h3>
                <button onclick="downloadWord()" class="chip-btn bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500">
                    <i class="fa-solid fa-file-word mr-1"></i> Скачать .docx
                </button>
            </div>
            
            <div id="result-container" class="bg-gray-900 p-3 rounded-xl text-xs text-gray-300 min-h-[220px] max-h-[450px] overflow-y-auto border border-gray-800 prose prose-invert">
                Результат появится здесь...
            </div>
        </div>
    </div>

    <script>
        let currentDocType = 'contract';
        let currentJurisdiction = 'Россия (РФ)';

        function setDocType(type, btn) {
            currentDocType = type;
            document.querySelectorAll('button[onclick^="setDocType"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setJurisdiction(jur, btn) {
            currentJurisdiction = jur;
            document.querySelectorAll('button[onclick^="setJurisdiction"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function generateDocument() {
            const container = document.getElementById('result-container');
            const resultWrapper = document.getElementById('result-wrapper');
            const homeBtn = document.getElementById('home-btn');

            resultWrapper.classList.remove('hidden');
            homeBtn.classList.remove('hidden');
            container.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Генерация документа через Gemini...';

            const payload = {
                doc_type: currentDocType,
                jurisdiction: currentJurisdiction,
                executor: document.getElementById('executor-input').value,
                client: document.getElementById('client-input').value,
                description: document.getElementById('desc-input').value,
                payment: "100% предоплата",
                deadline: "30 дней",
                revisions: "2"
            };

            try {
                const response = await fetch('/api/generate-document', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                let markdownText = "";
                if (typeof data === 'string') {
                    markdownText = data;
                } else if (data) {
                    markdownText = data.document || data.result || data.text || data.response || data.content || "";
                }

                if (!markdownText) {
                    markdownText = "Ошибка: получен пустой ответ от сервера.";
                }

                container.innerHTML = marked.parse(markdownText);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = "Ошибка генерации: " + error.message;
            }
        }

        async function downloadWord() {
            const payload = {
                doc_type: currentDocType,
                jurisdiction: currentJurisdiction,
                executor: document.getElementById('executor-input').value,
                client: document.getElementById('client-input').value,
                description: document.getElementById('desc-input').value,
                payment: "100% предоплата",
                deadline: "30 дней",
                revisions: "2",
                risks: []
            };

            try {
                const response = await fetch('/generate-protocol', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "Dogovor_Lexify.docx";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("Не удалось скачать файл. Попробуйте позже.");
                }
            } catch (e) {
                console.error("Ошибка скачивания:", e);
                alert("Ошибка при скачивании файла.");
            }
        }

        function goHome() {
            document.getElementById('result-wrapper').classList.add('hidden');
            document.getElementById('home-btn').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            goHome();
            document.getElementById('executor-input').value = "Иванов И.И.";
            document.getElementById('client-input').value = "ТОО «Альфа Технологии»";
            document.getElementById('desc-input').value = "Разработка программного модуля автоматизации";
        }
    </script>
</body>
</html>
