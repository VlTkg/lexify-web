<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexify — Экспресс-анализ договоров и Конструктор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #111827; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tg-card { background-color: #1f2937; border-color: #374151; word-break: break-word; overflow-wrap: break-word; }
        .transparent-card { background: transparent !important; border: none !important; }
        .identical-input-box { border: 1px solid #374151; background-color: #1f2937; border-radius: 0.75rem; padding: 0.65rem 0.875rem; font-size: 0.95rem; color: #ffffff; width: 100%; outline: none; }
        .identical-input-box:focus { border-color: #3b82f6; }
        .chip-btn {
            height: 34px; padding: 0 14px; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 500;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; border: 1px solid #374151;
        }
        .chip-btn.active { background-color: #3b82f6; color: #ffffff; border-color: #3b82f6; font-weight: 600; }
        .chip-btn:not(.active) { background-color: #1f2937; color: #9ca3af; }
        .chip-btn:not(.active):hover { background-color: #374151; color: #ffffff; }
        .btn-primary-action {
            height: 40px; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div class="max-w-2xl mx-auto p-4 space-y-6">
        <header class="text-center py-4">
            <h1 class="text-2xl font-bold tracking-tight text-white">Lexify</h1>
            <p class="text-xs text-gray-400 mt-1">Интеллектуальный помощник для работы с договорами</p>
        </header>

        <!-- Конструктор полного договора -->
        <div class="tg-card rounded-2xl p-5 border shadow-lg space-y-4">
            <h2 class="text-base font-semibold text-white">Конструктор полного договора</h2>
            
            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Тип документа</label>
                <div class="flex gap-2">
                    <button type="button" class="chip-btn active" onclick="setDocType('contract', this)">Договор оказания услуг</button>
                    <button type="button" class="chip-btn" onclick="setDocType('offer', this)">Публичная оферта</button>
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Юрисдикция</label>
                <div class="flex gap-2">
                    <button type="button" class="chip-btn active" onclick="setJurisdiction('Россия (РФ)', this)">Россия (РФ)</button>
                    <button type="button" class="chip-btn" onclick="setJurisdiction('Казахстан', this)">Казахстан</button>
                    <button type="button" class="chip-btn" onclick="setJurisdiction('Беларусь', this)">Беларусь</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-medium text-gray-300 block mb-1">Исполнитель (ФИО / Название)</label>
                    <input type="text" id="executor-input" class="identical-input-box" value="Иванов И.И.">
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-300 block mb-1">Заказчик (Компания / ФИО)</label>
                    <input type="text" id="client-input" class="identical-input-box" value="ТОО «Альфа Технологии»">
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Суть услуг и предмет договора</label>
                <textarea id="desc-input" rows="2" class="identical-input-box">Разработка программного модуля автоматизации бизнес-процессов</textarea>
            </div>

            <button onclick="generateDocument()" class="w-full btn-primary-action bg-blue-600 hover:bg-blue-500 text-white shadow-md">
                <i class="fa-solid fa-file-contract mr-2"></i> Сгенерировать договор
            </button>
        </div>

        <!-- Результат генерации -->
        <div class="tg-card rounded-2xl p-5 border shadow-lg space-y-3">
            <h3 class="text-sm font-semibold text-gray-200">Сгенерированный документ</h3>
            <div id="result-container" class="bg-gray-900 p-4 rounded-xl text-sm text-gray-300 min-h-[150px] max-h-[500px] overflow-y-auto border border-gray-800 prose prose-invert">
                Результат появится здесь...
            </div>
        </div>
    </div>

    <script>
        let currentDocType = 'contract';
        let currentJurisdiction = 'Россия (РФ)';

        function setDocType(type, btn) {
            currentDocType = type;
            document.querySelectorAll('button[onclick^="setDocType"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setJurisdiction(jur, btn) {
            currentJurisdiction = jur;
            document.querySelectorAll('button[onclick^="setJurisdiction"]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function generateDocument() {
            const container = document.getElementById('result-container');
            container.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Генерация документа через Gemini...';

            const payload = {
                doc_type: currentDocType,
                jurisdiction: currentJurisdiction,
                executor: document.getElementById('executor-input').value,
                client: document.getElementById('client-input').value,
                description: document.getElementById('desc-input').value,
                payment: "100% предоплата",
                deadline: "30 дней",
                revisions: "2"
            };

            try {
                const response = await fetch('/api/generate-document', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                let markdownText = "";
                if (typeof data === 'string') {
                    markdownText = data;
                } else if (data) {
                    markdownText = data.document || data.result || data.text || data.response || data.content || "";
                }

                if (!markdownText) {
                    markdownText = "Ошибка: получен пустой ответ от сервера.";
                }

                container.innerHTML = marked.parse(markdownText);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = "Ошибка генерации: " + error.message;
            }
        }
    </script>
</body>
</html>
