<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexify — Экспресс-анализ договоров</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- pdf.js for client-side PDF parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- mammoth.js for client-side DOCX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #64748b;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }

        body {
            background-color: #64748b !important;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .tg-card {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }

        .transparent-card {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .identical-input-box {
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            border-radius: 0.75rem;
            padding: 0.65rem 0.875rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #334155;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease-in-out;
        }

        .identical-input-box:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .chip-btn {
            transition: all 0.15s ease;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .chip-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="min-h-screen pb-6 pt-2 px-3 md:px-6">

    <div class="max-w-7xl mx-auto space-y-3">
        
        <!-- Header -->
        <header class="mb-1 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Lexify</h1>
                <p class="text-xs text-slate-200">Сервис автоматической проверки договоров для фрилансеров</p>
            </div>
            <!-- Счетчик проверок для Telegram-пользователей -->
            <div id="user-badge" class="bg-slate-700/90 px-3 py-1.5 rounded-xl border border-slate-500 text-xs text-slate-100 hidden shadow-sm flex items-center gap-2">
                <span>Проверок: <span id="checks-count" class="font-bold text-amber-400">3</span></span>
                <button type="button" onclick="openStarsModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-2 py-0.5 rounded-lg text-[11px] transition-all flex items-center gap-1 shadow-xs">
                    <i class="fa-solid fa-star text-[10px]"></i> Купить
                </button>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">

            <!-- LEFT COLUMN -->
            <main class="lg:col-span-7 flex flex-col justify-between space-y-3">

                <div class="space-y-3">
                    <!-- Block 1: How it works -->
                    <div class="transparent-card p-2.5">
                        <h2 class="text-xs font-bold text-white mb-1">Как это работает</h2>
                        <ol class="text-xs text-slate-100 space-y-0.5 pl-4 list-decimal leading-snug">
                            <li>Выберите тип договора и юрисдикцию</li>
                            <li>Загрузите файл или вставьте текст</li>
                            <li>Нажмите кнопку «Анализировать»</li>
                        </ol>
                    </div>

                    <!-- Block 2: Main Form Card -->
                    <div class="transparent-card p-0 space-y-3">
                        
                        <!-- Contract Type -->
                        <div>
                            <label class="block text-xs font-bold text-white mb-1.5">Тип договора</label>
                            <div class="flex flex-wrap gap-1.5" id="doc-type-group">
                                <button type="button" class="chip-btn active px-3 py-1.5 rounded-xl border border-slate-300" data-value="Общий">Общий</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="Трудовой">Трудовой</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="ГПХ/Услуги">ГПХ/Услуги</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="Аренда">Аренда</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="Поставка">Поставка</button>
                            </div>
                        </div>

                        <!-- Jurisdiction -->
                        <div>
                            <label class="block text-xs font-bold text-white mb-1.5">Юрисдикция</label>
                            <div class="flex flex-wrap gap-1.5" id="jurisdiction-group">
                                <button type="button" class="chip-btn active px-3 py-1.5 rounded-xl border border-slate-300" data-value="Россия (РФ)">Россия (РФ)</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="Казахстан">Казахстан</button>
                                <button type="button" class="chip-btn px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-800" data-value="Беларусь">Беларусь</button>
                            </div>
                        </div>

                        <!-- Input Area -->
                        <div class="space-y-2">
                            <!-- Dropzone / File selection -->
                            <div>
                                <div id="dropzone" class="identical-input-box justify-start cursor-pointer hover:bg-slate-50 transition-colors">
                                    <input type="file" id="file-input" accept=".pdf,.docx,.odt,.txt" class="hidden">
                                    
                                    <div id="dropzone-prompt"
